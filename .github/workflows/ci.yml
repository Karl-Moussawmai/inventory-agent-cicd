name: Inventory Agent CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/karl-moussawmai/inventory-agent-cicd:latest

    steps:
      - name: Download project files
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django project
        env:
          GEMINI_API_KEY: placeholder-for-django-check
        run: python manage.py check

      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      - name: Sign in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish Docker image
        run: docker push "$IMAGE"
